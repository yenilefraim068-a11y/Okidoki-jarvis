name: APK birlestir ve yayinla

on:
  push:
    paths:
      - 'incoming/**/manifest.json'

permissions:
  contents: write

concurrency:
  group: jarvis-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parcalari birlestir ve yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for m in incoming/*/manifest.json; do
            found=1
            d=$(dirname "$m")
            kind=$(jq -r .kind "$m")
            tag=$(jq -r .tag "$m")
            name=$(jq -r .name "$m")
            parts=$(jq -r .parts "$m")
            sum=$(jq -r .sha256 "$m")
            out="$RUNNER_TEMP/$name"
            : > "$out"
            for i in $(seq 1 "$parts"); do
              cat "$d/part$(printf %02d "$i")" >> "$out"
            done
            echo "$sum  $out" | sha256sum -c -

            if [ "$kind" = "cfg" ]; then
              gh release view cfg >/dev/null 2>&1 || \
                gh release create cfg --prerelease --title cfg --notes "ayar"
              gh release upload cfg "$out" --clobber
            else
              gh release view "$tag" >/dev/null 2>&1 || \
                gh release create "$tag" --title "JARVIS $tag" --notes "JARVIS sürüm $tag" --latest
              gh release upload "$tag" "$out" --clobber
            fi
            echo "Yayinlandi: $tag / $name"
            git rm -rq "$d"
          done

          if [ "$found" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "parcalar temizlendi [skip ci]" && git push || true
          fi
